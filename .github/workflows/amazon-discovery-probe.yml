name: Amazon discovery probe

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message || '', '[discovery-probe-result]') && !contains(github.event.head_commit.message || '', '[probe-result]') && !contains(github.event.head_commit.message || '', '[selftest-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Vercel
        run: sleep 45
      - name: Call production Amazon discovery probe
        shell: bash
        run: |
          set +e
          code=$(curl --silent --show-error --location --max-time 420 --output probe.json --write-out '%{http_code}' 'https://synthetic-review-lab.vercel.app/api/amazon-discovery-probe')
          status=$?
          echo "curl=$status HTTP=$code"
          cat probe.json || true
          if [ ! -f probe.json ]; then echo '{"ok":false,"error":"no response"}' > probe.json; fi
          node - <<'NODE'
          const fs=require('fs');let raw=fs.readFileSync('probe.json','utf8'),j;try{j=JSON.parse(raw)}catch(e){j={ok:false,error:'invalid_json',raw:raw.slice(0,6000)}};j.workflow={testedAt:new Date().toISOString(),commit:process.env.GITHUB_SHA};fs.writeFileSync('AMAZON_DISCOVERY_RESULT.json',JSON.stringify(j,null,2)+'\n');
          NODE
      - name: Publish discovery result
        run: |
          git config user.name 'amazon-discovery-probe-bot'
          git config user.email 'amazon-discovery-probe-bot@users.noreply.github.com'
          git add AMAZON_DISCOVERY_RESULT.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Amazon discovery result [discovery-probe-result]'
            git push origin HEAD:main
          fi
