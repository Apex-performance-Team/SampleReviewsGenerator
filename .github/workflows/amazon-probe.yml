name: Amazon review probe

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message || '', '[probe-result]') && !contains(github.event.head_commit.message || '', '[selftest-result]') && !contains(github.event.head_commit.message || '', '[source-probe-result]') && !contains(github.event.head_commit.message || '', '[discovery-probe-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Vercel
        run: sleep 45
      - name: Call production discovery and image probes
        shell: bash
        run: |
          set +e
          volume_code=$(curl --silent --show-error --location --max-time 420 --output volume.json --write-out '%{http_code}' 'https://synthetic-review-lab.vercel.app/api/amazon-volume-probe')
          volume_status=$?
          echo "volume curl=$volume_status HTTP=$volume_code"
          image_code=$(curl --silent --show-error --location --max-time 420 --output image.json --write-out '%{http_code}' 'https://synthetic-review-lab.vercel.app/api/image-similarity-probe')
          image_status=$?
          echo "image curl=$image_status HTTP=$image_code"
          [ -f volume.json ] || echo '{"ok":false,"error":"no volume response"}' > volume.json
          [ -f image.json ] || echo '{"ok":false,"error":"no image response"}' > image.json
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>{let raw=fs.readFileSync(p,'utf8');try{return JSON.parse(raw)}catch(e){return{ok:false,error:'invalid_json',raw:raw.slice(0,6000)}}};
          const out={volume:read('volume.json'),imageSimilarity:read('image.json'),workflow:{testedAt:new Date().toISOString(),commit:process.env.GITHUB_SHA}};
          out.ok=Boolean(out.volume?.ok||out.imageSimilarity?.ok);
          fs.writeFileSync('AMAZON_PROBE_RESULT.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Publish probe result
        run: |
          git config user.name 'amazon-probe-bot'
          git config user.email 'amazon-probe-bot@users.noreply.github.com'
          git add AMAZON_PROBE_RESULT.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Amazon probe result [probe-result]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
