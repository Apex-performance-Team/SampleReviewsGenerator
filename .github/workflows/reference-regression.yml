name: Reference regression

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-reference-regression:
    if: ${{ !contains(github.event.head_commit.message || '', '[selftest-result]') && !contains(github.event.head_commit.message || '', '[probe-result]') && !contains(github.event.head_commit.message || '', '[source-probe-result]') && !contains(github.event.head_commit.message || '', '[discovery-probe-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for production deployment
        run: sleep 55

      - name: Prove Amazon review collector independently
        shell: bash
        continue-on-error: true
        run: |
          set +e
          BASE='https://synthetic-review-lab.vercel.app'
          cat > deterministic-enrich-request.json <<'JSON'
          {"referenceSet":{"productUrl":"https://www.amazon.com/dp/B089LMG6L4","productTitle":"1byone Outdoor TV Antenna 360° Omni-Directional Reception 100+ Miles Range","productDescription":"Collector-only regression fixture. Identity discovery is intentionally bypassed because this source is already verified.","references":[],"sourceCounts":[{"directSourceUrl":"https://www.amazon.com/dp/B089LMG6L4","sourceUrl":"https://www.amazon.com/dp/B089LMG6L4","platform":"amazon.com","provider":"bright_data_amazon_reviews_v2","asin":"B089LMG6L4","title":"1byone Outdoor TV Antenna 360° Omni-Directional Reception 100+ Miles Range","publicReviewCount":33151,"aggregateOnly":true,"status":"found","discoveryOrigin":"amazon_high_volume","matchConfidence":0.99,"linkVerified":true}],"aggregateOnlySources":[]}}
          JSON
          code=$(curl --silent --show-error --location --max-time 600 --header 'content-type: application/json' --data-binary @deterministic-enrich-request.json --output deterministic-enriched.json --write-out '%{http_code}' "$BASE/api/reference-enrich-marketplaces")
          echo "collector fixture HTTP=$code"
          node - <<'NODE'
          const fs=require('fs');
          const unavailable=s=>/customer is not active|invalid status|positive credit balance|required for all requests|account.*inactive/i.test(String(s||''));
          let j={};try{j=JSON.parse(fs.readFileSync('deterministic-enriched.json','utf8'))}catch(e){j={error:e.message}}
          const refs=j.referenceSet?.references||[],ingestion=j.referenceSet?.marketplaceIngestion||null,target=(ingestion?.sources||[])[0]||null;
          const providerUnavailable=unavailable(target?.error)||unavailable(j.error);
          const out={ok:refs.length>=200,providerUnavailable,amazonReferences:refs.length,totalReferences:refs.length,targetSource:target,sampleAmazon:refs.slice(0,2).map(r=>({id:r.sourceReviewId||'',body:String(r.sourceBody||'').slice(0,260)})),marketplaceIngestion:ingestion,error:j.error||null};
          fs.writeFileSync('deterministic-result.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
          NODE

      - name: Test real Premium Indoor PDP end to end
        shell: bash
        continue-on-error: true
        run: |
          set +e
          BASE='https://synthetic-review-lab.vercel.app'
          cat > live-scan-request.json <<'JSON'
          {"productUrl":"https://instabeamtv.com/products/premium-antenna-1","productTitle":"InstaBeam Premium Indoor HDTV Antenna","productDescription":"Premium indoor HDTV antenna. Use the authoritative PDP itself for product identity and same-product matching.","existingReviewCount":0,"targetReferenceCount":250,"originalReviewCount":0}
          JSON
          rm -f live-scan.json live-enrich-request.json live-result.json live-enriched.json
          scan_code=000
          for attempt in 1 2 3; do
            echo "reference scan attempt $attempt"
            scan_code=$(curl --silent --show-error --location --max-time 420 --header 'content-type: application/json' --data-binary @live-scan-request.json --output live-scan.json --write-out '%{http_code}' "$BASE/api/reference-scan")
            node - <<'NODE'
          const fs=require('fs'); let j={};try{j=JSON.parse(fs.readFileSync('live-scan.json','utf8'))}catch{}
          process.exit(j.referenceSet ? 0 : 1)
          NODE
            if [ $? -eq 0 ]; then break; fi
            echo "reference scan attempt $attempt failed HTTP=$scan_code"
            cat live-scan.json || true
            sleep 18
          done
          node - <<'NODE'
          const fs=require('fs');let j={};try{j=JSON.parse(fs.readFileSync('live-scan.json','utf8'))}catch(e){j={error:e.message}}
          if(j.referenceSet) fs.writeFileSync('live-enrich-request.json',JSON.stringify({referenceSet:j.referenceSet}));
          else fs.writeFileSync('live-result.json',JSON.stringify({ok:false,stage:'reference_scan',error:j.error||'referenceSet missing',response:j},null,2));
          NODE
          if [ -f live-enrich-request.json ]; then
            enrich_code=$(curl --silent --show-error --location --max-time 600 --header 'content-type: application/json' --data-binary @live-enrich-request.json --output live-enriched.json --write-out '%{http_code}' "$BASE/api/reference-enrich-marketplaces")
            echo "live enrichment HTTP=$enrich_code"
            node - <<'NODE'
          const fs=require('fs');
          const unavailable=s=>/customer is not active|invalid status|positive credit balance|required for all requests|account.*inactive/i.test(String(s||''));
          const host=x=>{try{return new URL(x).hostname.replace(/^www\./,'').toLowerCase()}catch{return''}};
          const scan=JSON.parse(fs.readFileSync('live-scan.json','utf8')),base=scan.referenceSet;let j={};try{j=JSON.parse(fs.readFileSync('live-enriched.json','utf8'))}catch(e){j={error:e.message}}
          const before=base?.references||[],after=j.referenceSet?.references||[],sourceRows=j.referenceSet?.sourceCounts||base?.sourceCounts||[],market=after.filter(r=>/(^|\.)(amazon|ebay)\./i.test(host(r.sourceUrl))),amazon=market.filter(r=>/(^|\.)amazon\./i.test(host(r.sourceUrl))),ebay=market.filter(r=>/(^|\.)ebay\./i.test(host(r.sourceUrl)));
          const ingestion=j.referenceSet?.marketplaceIngestion||null,fallback=base?.amazonFallbackDiscovery||j.referenceSet?.amazonFallbackDiscovery||null;
          const errors=[j.error,fallback?.diagnostics?.error,fallback?.diagnostics?.providerFallback?.diagnostics?.error,...(ingestion?.sources||[]).map(s=>s.error)].filter(Boolean);
          const providerUnavailable=errors.some(unavailable);
          const verifiedSources=sourceRows.filter(s=>s.linkVerified!==false&&Number(s.matchConfidence||0)>=.8);
          const corpusNeverShrank=after.length>=before.length,corpusTargetMet=after.length>=200;
          const ok=verifiedSources.length>0&&corpusNeverShrank&&after.length>0;
          fs.writeFileSync('live-result.json',JSON.stringify({ok,providerUnavailable,stage:ok?'pass':providerUnavailable?'external_provider_unavailable':verifiedSources.length===0?'no_verified_same_product_source':'live_corpus_missing',authoritativeProductTitle:base?.productTitle||null,baselineReferences:before.length,enrichedReferences:after.length,corpusTargetMet,marketplaceReferences:market.length,amazonReferences:amazon.length,ebayReferences:ebay.length,corpusNeverShrank,verifiedSources:verifiedSources.map(s=>({url:s.directSourceUrl||s.sourceUrl,asin:s.asin||null,title:s.title||null,platform:s.platform,matchConfidence:s.matchConfidence,verificationMethod:s.verificationMethod,reviewCount:s.publicReviewCount??s.reviewCount??null})),amazonFallbackDiscovery:fallback,marketplaceIngestion:ingestion,errors,error:j.error||null},null,2));
          NODE
          fi

      - name: Build regression result
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'); const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch(e){return{ok:false,error:e.message}}};
          const deterministic=read('deterministic-result.json'),live=read('live-result.json');
          const externalProviderUnavailable=Boolean(deterministic.providerUnavailable||live.providerUnavailable);
          const checks={collectorFixtureExtracted:Number(deterministic.amazonReferences)>=200,liveSameProductSourceDiscovered:Array.isArray(live.verifiedSources)&&live.verifiedSources.length>0,liveCorpusNeverShrank:Boolean(live.corpusNeverShrank),liveMarketplaceBodiesExtracted:Number(live.enrichedReferences)>0,liveCorpusTargetMet:Boolean(live.corpusTargetMet)};
          const functional=Boolean(deterministic.ok&&live.ok&&checks.liveCorpusNeverShrank);
          const stage=externalProviderUnavailable?'external_provider_unavailable':!deterministic.ok?'amazon_collector_failed':!live.ok?(live.stage||'live_failed'):checks.liveCorpusTargetMet?'pass':'pass_below_200_corpus';
          const out={ok:functional&&!externalProviderUnavailable,stage,externalProviderUnavailable,deterministic,live,checks,workflow:{testedAt:new Date().toISOString(),commit:process.env.GITHUB_SHA}};
          fs.writeFileSync('REFERENCE_SELFTEST_RESULT.json',JSON.stringify(out,null,2)+'\n'); console.log(JSON.stringify(out,null,2));
          NODE

      - name: Publish self-test result
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'reference-selftest-bot'
          git config user.email 'reference-selftest-bot@users.noreply.github.com'
          git add REFERENCE_SELFTEST_RESULT.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update production self-test result [selftest-result]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce regression gate
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const j=require('./REFERENCE_SELFTEST_RESULT.json');
          if(j.externalProviderUnavailable){console.warn('Reference regression is blocked by an external provider account/credit state, not a code assertion.');process.exit(0)}
          if(!j.ok) throw new Error(`Production reference regression failed at ${j.stage}`);
          if(!j.checks.collectorFixtureExtracted) throw new Error('Amazon collector fixture did not return at least 200 real review bodies');
          if(!j.checks.liveSameProductSourceDiscovered||!j.checks.liveCorpusNeverShrank||!j.checks.liveMarketplaceBodiesExtracted) throw new Error('Live same-product discovery/enrichment failed');
          NODE
