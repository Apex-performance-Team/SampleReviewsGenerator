name: Reference regression

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-reference-regression:
    if: ${{ !contains(github.event.head_commit.message || '', '[selftest-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for production deployment
        run: sleep 55
      - name: Test production marketplace ingestion
        shell: bash
        continue-on-error: true
        run: |
          set +e
          BASE='https://synthetic-review-lab.vercel.app'
          cat > deterministic-enrich-request.json <<'JSON'
          {
            "referenceSet": {
              "productUrl":"https://instabeamtv.com/products/premium-antenna-1",
              "productTitle":"InstaBeam Premium Indoor HDTV Antenna",
              "references":[],
              "sourceCounts":[
                {
                  "directSourceUrl":"https://www.amazon.com/dp/B0845Y7DGS",
                  "sourceUrl":"https://www.amazon.com/dp/B0845Y7DGS",
                  "platform":"amazon.com",
                  "provider":"bright_data_google_lens",
                  "asin":"B0845Y7DGS",
                  "publicReviewCount":1148,
                  "aggregateOnly":true,
                  "status":"found"
                },
                {
                  "directSourceUrl":"https://www.ebay.com/itm/176327212659",
                  "sourceUrl":"https://www.ebay.com/itm/176327212659",
                  "platform":"ebay.com",
                  "provider":"bright_data_google_lens",
                  "publicReviewCount":12,
                  "aggregateOnly":false,
                  "status":"found"
                }
              ],
              "aggregateOnlySources":[]
            }
          }
          JSON

          echo 'Calling deterministic production marketplace enrichment...'
          code=$(curl --silent --show-error --location --max-time 420 \
            --header 'content-type: application/json' \
            --data-binary @deterministic-enrich-request.json \
            --output deterministic-enriched.json --write-out '%{http_code}' \
            "$BASE/api/reference-enrich-marketplaces")
          curl_status=$?
          echo "curl=$curl_status HTTP=$code"
          [ -f deterministic-enriched.json ] && cat deterministic-enriched.json || true
          echo

          node - <<'NODE'
          const fs=require('fs');
          const host=x=>{try{return new URL(x).hostname.replace(/^www\./,'').toLowerCase()}catch{return''}};
          let raw='';try{raw=fs.readFileSync('deterministic-enriched.json','utf8')}catch{}
          let j;try{j=JSON.parse(raw)}catch{j={error:'invalid enrichment JSON',raw:raw.slice(0,6000)}}
          const rs=j.referenceSet||{},refs=Array.isArray(rs.references)?rs.references:[],amazon=refs.filter(r=>/(^|\.)amazon\./i.test(host(r.sourceUrl))),ebay=refs.filter(r=>/(^|\.)ebay\./i.test(host(r.sourceUrl)));
          const out={
            ok:Boolean(j.referenceSet)&&amazon.length>0&&ebay.length>0,
            stage:Boolean(j.referenceSet)&&amazon.length>0&&ebay.length>0?'pass':'deterministic_marketplace_reviews_missing',
            totalReferences:refs.length,
            amazonReferences:amazon.length,
            ebayReferences:ebay.length,
            sampleAmazon:amazon.slice(0,2).map(r=>({sourceUrl:r.sourceUrl,title:r.sourceTitle||'',body:String(r.sourceBody||'').slice(0,260),rating:r.sourceRating??null,provider:r.provider||''})),
            sampleEbay:ebay.slice(0,2).map(r=>({sourceUrl:r.sourceUrl,title:r.sourceTitle||'',body:String(r.sourceBody||'').slice(0,260),rating:r.sourceRating??null,provider:r.provider||''})),
            marketplaceIngestion:rs.marketplaceIngestion||null,
            responseError:j.error||null,
            checks:{amazonBodiesExtracted:amazon.length>0,ebayBodiesExtracted:ebay.length>0},
            workflow:{testedAt:new Date().toISOString(),commit:process.env.GITHUB_SHA}
          };
          fs.writeFileSync('REFERENCE_SELFTEST_RESULT.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Publish self-test result
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'reference-selftest-bot'
          git config user.email 'reference-selftest-bot@users.noreply.github.com'
          git add REFERENCE_SELFTEST_RESULT.json
          if git diff --cached --quiet; then
            echo 'No self-test result change to publish.'
          else
            git commit -m 'Update production self-test result [selftest-result]'
            git push origin HEAD:main
          fi
      - name: Enforce regression gate
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('REFERENCE_SELFTEST_RESULT.json','utf8'));
          if(!j.ok) throw new Error(`Production marketplace regression failed at ${j.stage||'unknown'}`);
          if(!j.checks?.amazonBodiesExtracted) throw new Error('No Amazon individual review bodies extracted');
          if(!j.checks?.ebayBodiesExtracted) throw new Error('No eBay individual review bodies extracted');
          NODE
